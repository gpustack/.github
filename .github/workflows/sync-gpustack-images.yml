name: sync-gpustack-images

on:
  schedule:
    # Weekly: sync missing or changed images used by dev
    - cron: "25 18 * * 0"
    # Every 4 hours: sync only gpustack/gpustack:dev
    - cron: "45 */4 * * *"
  workflow_dispatch:
    inputs:
      dev:
        description: "Whether to sync dev images instead of release images (default: false)"
        required: false
        default: false
        type: boolean
      docker_login:
        description: "Log in to Docker Hub to raise the pull rate limit (default: false)"
        required: false
        default: false
        type: boolean
      full_sync:
        description: "Copy all images of the target tag even when destination digests match (default: false)"
        required: false
        default: false
        type: boolean
      force_sync:
        description: "Comma-separated images to force sync, e.g. gpustack:dev,mirrored-node-feature-discovery:v0.18.3 (gpustack/ namespace is prepended automatically)"
        required: false
        default: ""
        type: string

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync-images:
    name: Compare and Sync Images
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Login to Docker Hub (Improve API Limits)
        if: inputs.docker_login == true
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          printf '%s' "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" docker.io --password-stdin

      - name: 🏷️ Determine Target Tag
        env:
          DEV: ${{ inputs.dev }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_SYNC: ${{ inputs.force_sync }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$FORCE_SYNC" ]]; then
            LATEST_TAG=custom
          elif [[ "$DEV" == 'true' || "$EVENT_NAME" == 'schedule' ]]; then
            LATEST_TAG=dev
          else
            LATEST_TAG=$(curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
              'https://api.github.com/repos/gpustack/gpustack/releases?page=1&per_page=1' | jq -er '.[0].tag_name // empty')
          fi

          echo "🚀 Target tag: $LATEST_TAG"
          echo "LATEST_TAG=$LATEST_TAG" >> "$GITHUB_ENV"

      - name: 🔍 Determine Images to Sync
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          FORCE_SYNC: ${{ inputs.force_sync }}
        run: |
          # Build the list of images to sync based on the trigger and inputs
          if [[ "$EVENT_NAME" == 'schedule' && "$EVENT_SCHEDULE" == '45 */4 * * *' ]]; then
            # Every-4-hours schedule: only sync gpustack/gpustack:dev
            IMAGES_TO_SYNC="gpustack/gpustack:dev"
          elif [[ -n "$FORCE_SYNC" ]]; then
            # Force sync: only the specified images (comma-separated name:tag, gpustack/ namespace prepended)
            IMAGES_TO_SYNC=$(printf '%s\n' "$FORCE_SYNC" | tr ',' '\n' | \
              sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d' | sed 's#^#gpustack/#' | awk '!seen[$0]++')
            echo "🔧 Force-sync images requested:"
            echo "$IMAGES_TO_SYNC"
          else
            # Check every target image so mutable tags are compared even when their names stay the same.
            IMAGES_TO_SYNC=$(docker run -q --rm --pull=always --entrypoint gpustack \
              gpustack/gpustack:"$LATEST_TAG" list-images | sed '/^$/d' | awk '!seen[$0]++')
          fi

          # On release syncs (manual dispatch with dev=false), also sync gpustack/gpustack:latest.
          # Schedules set LATEST_TAG=dev, so they are excluded; force_sync uses an explicit list.
          if [[ "$LATEST_TAG" != 'dev' && -z "$FORCE_SYNC" ]]; then
            echo "🏷️ Release sync: including gpustack/gpustack:latest"
            IMAGES_TO_SYNC=$(printf '%s\n' "$IMAGES_TO_SYNC" "gpustack/gpustack:latest" | sed '/^$/d' | awk '!seen[$0]++')
          fi

          if [ -z "$IMAGES_TO_SYNC" ]; then
            echo "✅ No images found for synchronization."
            echo "HAS_IMAGES=false" >> "$GITHUB_ENV"
          else
            echo "📦 Images identified for synchronization:"
            echo "$IMAGES_TO_SYNC"
          
            echo "HAS_IMAGES=true" >> "$GITHUB_ENV"
          
            {
              echo "IMAGES_TO_SYNC<<EOF"
              echo "$IMAGES_TO_SYNC"
              echo "EOF"
            } >> "$GITHUB_ENV"
          
            # Initialize the Job Summary header
            echo "### 🔄 Image Synchronization Report" >> "$GITHUB_STEP_SUMMARY"
            echo "Target tag: \`$LATEST_TAG\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 🔄 Compare Digests and Sync to Quay.io / SWR
        if: env.HAS_IMAGES == 'true'
        env:
          FULL_SYNC: ${{ inputs.full_sync }}
          FORCE_SYNC: ${{ inputs.force_sync }}
          DOCKER_QUAY_USER: ${{ secrets.DOCKER_QUAY_USER }}
          DOCKER_QUAY_PASSWORD: ${{ secrets.DOCKER_QUAY_PASSWORD }}
          DOCKER_SWR_REGISTRY: ${{ secrets.DOCKER_SWR_REGISTRY }}
          DOCKER_SWR_USER: ${{ secrets.DOCKER_SWR_USER }}
          DOCKER_SWR_PASSWORD: ${{ secrets.DOCKER_SWR_PASSWORD }}
        run: |
          printf '%s' "$DOCKER_QUAY_PASSWORD" | skopeo login -u "$DOCKER_QUAY_USER" quay.io --password-stdin
          printf '%s' "$DOCKER_SWR_PASSWORD" | skopeo login -u "$DOCKER_SWR_USER" "$DOCKER_SWR_REGISTRY" --password-stdin

          MANIFEST=$(mktemp)
          trap 'rm -f "$MANIFEST"' EXIT

          # Hash the raw top-level manifest/index so changes to any architecture are detected.
          get_digest() {
            skopeo inspect --raw --retry-times 3 "docker://$1" > "$MANIFEST" || return 1
            skopeo manifest-digest "$MANIFEST"
          }

          printf '\n| Image | Registry | Result |\n|---|---|---|\n' >> "$GITHUB_STEP_SUMMARY"

          while read -r image; do
            [[ -n "$image" ]] || continue
            source_digest=$(get_digest "$image")
            # Pin both copies to the inspected digest in case the source tag moves during this run.
            source_ref="${image%:*}@$source_digest"

            for registry in quay.io "$DOCKER_SWR_REGISTRY"; do
              target="$registry/$image"
              if [[ "$FULL_SYNC" != 'true' && -z "$FORCE_SYNC" ]]; then
                if target_digest=$(get_digest "$target"); then
                  if [[ "$source_digest" == "$target_digest" ]]; then
                    echo "✅ Up to date: $target ($source_digest)"
                    printf '| `%s` | `%s` | Already up to date |\n' "$image" "$registry" >> "$GITHUB_STEP_SUMMARY"
                    continue
                  fi
                  echo "🔄 Digest changed: $target ($target_digest → $source_digest)"
                else
                  echo "::warning::Cannot read destination digest for $target; attempting copy"
                fi
              fi

              echo "➡️ Syncing: $image → $target ($source_digest)"
              skopeo copy --all --preserve-digests --retry-times 3 "docker://$source_ref" "docker://$target"
              printf '| `%s` | `%s` | Synced |\n' "$image" "$registry" >> "$GITHUB_STEP_SUMMARY"
            done
          done <<< "$IMAGES_TO_SYNC"
