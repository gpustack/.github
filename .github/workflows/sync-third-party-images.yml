name: sync-third-party-images
run-name: "Sync: ${{ inputs.images }}"

permissions: {}

defaults:
  run:
    shell: bash

# Run it from the Actions tab via "Run workflow"; results are shown in the job summary.
on:
  workflow_dispatch:
    inputs:
      images:
        description: "Comma-separated SOURCE[=TARGET] entries, where TARGET is [namespace/]name[:tag] or :tag, e.g. vllm/vllm-openai:v1,quay.io/org/app:v1=app:v2. A SOURCE given only by digest requires a target tag. Targets that would replace images published by GPUStack are rejected."
        required: true
        type: string
      to_quay:
        description: "Sync to Quay.io"
        required: false
        default: true
        type: boolean
      to_swr:
        description: "Sync to Huawei Cloud SWR"
        required: false
        default: false
        type: boolean
      to_dockerhub:
        description: "Sync to Docker Hub"
        required: false
        default: false
        type: boolean
      mirrored:
        description: "Add the mirrored- prefix to the target image name, unless TARGET sets a name"
        required: false
        default: false
        type: boolean
      overwrite:
        description: "Replace existing target tags whose digest differs from the source"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync-images:
    name: Sync Images
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # skopeo is preinstalled on GitHub-hosted Ubuntu runners.
      - name: 🔄 Sync Images
        env:
          # Inputs go through env instead of being inlined, to avoid shell injection.
          IMAGES: ${{ inputs.images }}
          TARGETS: ${{ format('{0} {1} {2}', inputs.to_quay && 'quay' || '', inputs.to_swr && 'swr' || '', inputs.to_dockerhub && 'dockerhub' || '') }}
          MIRRORED: ${{ inputs.mirrored }}
          OVERWRITE: ${{ inputs.overwrite }}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_QUAY_USER: ${{ secrets.DOCKER_QUAY_USER }}
          DOCKER_QUAY_PASSWORD: ${{ secrets.DOCKER_QUAY_PASSWORD }}
          DOCKER_SWR_REGISTRY: ${{ secrets.DOCKER_SWR_REGISTRY }}
          DOCKER_SWR_USER: ${{ secrets.DOCKER_SWR_USER }}
          DOCKER_SWR_PASSWORD: ${{ secrets.DOCKER_SWR_PASSWORD }}
        run: |
          # Failures are expected and handled per image, so turn off the default bash -e.
          set +e -uo pipefail

          # Accept the SWR registry with or without a scheme or trailing path.
          SWR_HOST="${DOCKER_SWR_REGISTRY:-}"
          SWR_HOST="${SWR_HOST#*://}"
          SWR_HOST="${SWR_HOST%%/*}"

          declare -A NAMESPACES=([quay]=quay.io/gpustack [dockerhub]=docker.io/gpustack)
          [[ -n "$SWR_HOST" ]] && NAMESPACES[swr]="$SWR_HOST/gpustack"

          # Images published by GPUStack must never be replaced; overwrite does not change that.
          BLOCKED_RE='^gpustack/(benchmark-runner|gpustack|gpustack-operator|higress-plugins|llm-router|runner|runtime|ssh-server)$'
          AUTH_RE='unauthorized|denied|authentication required|status code 401|forbidden|status code 403'
          RATE_RE='toomanyrequests|too many requests|status code 429|rate limit'

          declare -A LOGGED_IN=()
          ROWS=() PULLS=() FAILS=()
          LAST_ERR=""
          TMP=$(mktemp) ERR=$(mktemp)

          log() { echo "$*" >&2; }
          err() { echo "::error::$*" >&2; }

          add_row() { ROWS+=("| $1 | \`$2\` | \`$3\` | ${4:+\`${4:7:12}\`} | $5 |"); }

          # synced <source> <target> <digest> <note>
          synced() { PULLS+=("$2"); add_row ✅ "$1" "$2" "$3" "$4"; }

          # failed <source> <target> <note> [details, default $LAST_ERR]
          failed() {
            local details
            details=$(tail -n 20 <<< "${4:-${LAST_ERR:-(no further output)}}")
            FAILS+=("<details><summary><code>$1</code> → <code>$2</code>: $3</summary>"$'\n\n```\n'"$details"$'\n```\n</details>')
            add_row ❌ "$1" "$2" "" "$3"
          }

          write_summary() {
            {
              printf '## 🔄 Third-party Image Sync Results\n\n'
              printf '✅ %s synced · ❌ %s failed · **Targets:** `%s` · **Mirrored:** %s · **Overwrite:** %s\n' \
                "${#PULLS[@]}" "${#FAILS[@]}" "$TARGETS" "$MIRRORED" "$OVERWRITE"
              if ((${#ROWS[@]})); then
                printf '\n### Details\n\n| | Source | Target | Digest | Note |\n|:-:|---|---|---|---|\n'
                printf '%s\n' "${ROWS[@]}"
              fi
              if ((${#PULLS[@]})); then
                printf '\n### 📦 Pull commands\n\n```bash\n'
                printf 'docker pull %s\n' "${PULLS[@]}"
                printf '```\n'
              fi
              if ((${#FAILS[@]})); then
                printf '\n### ❌ Failure details\n\n'
                printf '%s\n\n' "${FAILS[@]}"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          # Fully qualify a reference: ubuntu -> docker.io/library/ubuntu:latest
          normalize() {
            local ref="${1#docker://}" first
            first="${ref%%/*}"
            if [[ "$ref" != */* ]]; then
              ref="docker.io/library/$ref"
            elif [[ "$first" != *[.:]* && "$first" != localhost ]]; then
              ref="docker.io/$ref"
            fi
            ref="${ref/#index.docker.io\//docker.io/}"
            [[ "${ref##*/}" == *[:@]* ]] || ref="$ref:latest"
            echo "$ref"
          }

          # skopeo rejects name:tag@digest, so read from name@digest instead.
          pull_ref() {
            local repo="${1%@*}"
            [[ "$1" == *@* && "${repo##*/}" == *:* ]] && { echo "${repo%:*}@${1##*@}"; return; }
            echo "$1"
          }

          valid_target() {
            [[ "$1" != *@* && "$1" != /* && "$1" != */ && "$1" != *: ]] &&
              [[ "$1" != */* || "${1%%/*}" != *[.:]* ]]
          }

          # build_target <source> <namespace> [target]
          # target is :tag, name[:tag] or namespace/name[:tag]; the source name and tag fill
          # in what it omits. Returns 1 when no tag can be determined (digest-only source).
          build_target() {
            local ns="$2" target="${3:-}" last="${1##*/}" name tag=""
            last="${last%%@*}"
            name="${last%%:*}"
            [[ "$last" == *:* ]] && tag="${last##*:}"

            if [[ -z "$target" || "$target" == :* ]]; then
              [[ -z "$target" ]] || tag="${target#:}"
              [[ "$MIRRORED" == true ]] && name="mirrored-$name"
              target="$name"
            fi
            if [[ "${target##*/}" != *:* ]]; then
              [[ -n "$tag" ]] || return 1
              target="$target:$tag"
            fi
            if [[ "$target" == */* ]]; then echo "${ns%%/*}/$target"; else echo "$ns/$target"; fi
          }

          # Log in to a registry at most once. On failure, returns 1 with details in $LAST_ERR.
          login() {
            local host="$1" user="" pass="" out
            [[ -n "${LOGGED_IN[$host]:-}" ]] && return 0
            case "$host" in
              docker.io)   user="$DOCKER_USER";      pass="$DOCKER_PASSWORD" ;;
              quay.io)     user="$DOCKER_QUAY_USER"; pass="$DOCKER_QUAY_PASSWORD" ;;
              "$SWR_HOST") user="$DOCKER_SWR_USER";  pass="$DOCKER_SWR_PASSWORD" ;;
            esac
            if [[ -z "$user" || -z "$pass" ]]; then
              LAST_ERR="$host requires login, but no credentials are configured"
              return 1
            fi
            if ! out=$(printf '%s' "$pass" | skopeo login "$host" --username "$user" --password-stdin 2>&1); then
              LAST_ERR="Login to $host failed: $out"
              err "Failed to log in to $host, please check the credentials"
              return 1
            fi
            LOGGED_IN[$host]=1
            log "🔑 Logged in to $host"
          }

          # with_auth <src_host> <dst_host|-> <command...>
          # Sources are read anonymously first: on 401/429 from the source, log in once and
          # retry. A denial from the target is a permission problem and is not retried.
          # Stdout passes through; error output ends up in $LAST_ERR.
          with_auth() {
            local src_host="$1" dst_host="$2" attempt from_target target_re=destination
            shift 2
            [[ "$dst_host" == - || "$dst_host" == "$src_host" ]] || target_re+="|$dst_host"
            for attempt in 1 2 3 4; do
              "$@" 2>"$ERR" && { LAST_ERR=""; return 0; }

              from_target=false
              grep -qiE "$target_re" "$ERR" && from_target=true

              if [[ "$from_target" == false && -z "${LOGGED_IN[$src_host]:-}" ]] && grep -qiE "$AUTH_RE|$RATE_RE" "$ERR"; then
                log "🔒 $src_host denied or rate limited anonymous access, trying to log in"
                login "$src_host" && continue
                echo "$LAST_ERR" >> "$ERR"
              fi

              if grep -qiE "$RATE_RE" "$ERR" && ((attempt < 4)); then
                sleep $((attempt * 30))
                continue
              fi
              if [[ "$from_target" == true ]] && grep -qiE "$AUTH_RE" "$ERR"; then
                echo "Access denied by target $dst_host, check that the account can push (and create repositories) there" >> "$ERR"
              fi
              break
            done
            LAST_ERR=$(cat "$ERR")
            log "$LAST_ERR"
            return 1
          }

          sync_one() {
            local shown="$1" dst="$2" src src_host dst_host src_digest dst_digest=""
            src=$(pull_ref "$shown")
            src_host="${src%%/*}"
            dst_host="${dst%%/*}"

            login "$dst_host" || { failed "$shown" "$dst" "Cannot log in to target registry"; return; }
            with_auth "$src_host" - skopeo inspect --raw --retry-times 3 "docker://$src" >"$TMP" ||
              { failed "$shown" "$dst" "Cannot read source manifest"; return; }
            src_digest=$(skopeo manifest-digest "$TMP" 2>/dev/null)

            # Different sources can map to the same target, so never replace a tag by accident.
            if skopeo inspect --raw --retry-times 3 "docker://$dst" >"$TMP" 2>/dev/null; then
              dst_digest=$(skopeo manifest-digest "$TMP" 2>/dev/null)
            fi
            if [[ -n "$dst_digest" && "$dst_digest" == "$src_digest" ]]; then
              synced "$shown" "$dst" "$src_digest" "Already up to date"
              return
            fi
            if [[ -n "$dst_digest" && "$OVERWRITE" != true ]]; then
              failed "$shown" "$dst" "Target tag exists with a different digest" \
                "Target has $dst_digest, source has ${src_digest:-unknown}. Enable overwrite to replace it, or enable mirrored to use a prefixed name."
              return
            fi

            with_auth "$src_host" "$dst_host" skopeo copy --all --preserve-digests --retry-times 3 \
              --digestfile "$TMP" "docker://$src" "docker://$dst" || { failed "$shown" "$dst" "Copy failed"; return; }
            synced "$shown" "$dst" "$(cat "$TMP")" "Synced"
          }

          main() {
            local entry target src t dst path
            local -a entries targets
            local -A seen=()

            # References never contain whitespace; stripping it tolerates "a = b" and ", ".
            IFS=',' read -ra entries <<< "${IMAGES//[[:space:]]/}"
            read -ra targets <<< "$TARGETS"
            TARGETS="${targets[*]}"

            if [[ -z "${IMAGES//[[:space:],]/}" ]]; then err "Please provide at least one image"; exit 1; fi
            if ((${#targets[@]} == 0)); then err "Please choose at least one target"; exit 1; fi

            for entry in "${entries[@]}"; do
              [[ -n "$entry" ]] || continue
              target=""
              [[ "$entry" == *=* ]] && target="${entry#*=}"
              src=$(normalize "${entry%%=*}")
              [[ -z "${seen[$src=$target]:-}" ]] || continue
              seen[$src=$target]=1

              if [[ -n "$target" ]] && ! valid_target "$target"; then
                failed "$src" "$target" "Invalid target" "Expected [namespace/]name[:tag] or :tag, without a registry host or digest"
                continue
              fi

              for t in "${targets[@]}"; do
                if [[ -z "${NAMESPACES[$t]:-}" ]]; then
                  failed "$src" "$t" "Unconfigured target" "Secret DOCKER_SWR_REGISTRY is not configured"
                  continue
                fi
                if ! dst=$(build_target "$src" "${NAMESPACES[$t]}" "$target"); then
                  failed "$src" "${target:--}" "Cannot determine the target tag" "A digest has no tag to reuse. Name one, e.g. vllm/vllm-openai@sha256:...=:v1"
                  continue 2
                fi

                path="${dst#*/}"
                path="${path%:*}"
                if [[ "${path,,}" =~ $BLOCKED_RE ]]; then
                  failed "$src" "$dst" "Blocked target image" "This target would replace an image published by GPUStack. Use another name, or enable mirrored."
                  continue
                fi

                echo "::group::$src → $dst"
                sync_one "$src" "$dst"
                echo "::endgroup::"
              done
            done

            ((${#FAILS[@]} == 0))
          }

          trap write_summary EXIT
          main
