# This reusable workflow runs AI code review on a pull request: it resolves the PR refs
# (for comment triggers), mints a GitHub App installation token, and invokes the
# OpenCodeReview composite action, which reviews the base..head diff with an LLM and posts
# inline + summary comments under the App's identity. Review comments are the only
# deliverable — SARIF / Code Scanning upload was evaluated and deliberately dropped.
#
# It exists so every gpustack repo gets the same review pipeline: trigger gating,
# concurrency and the review itself are all fixed here once, so a fix or a policy change
# (e.g. who may re-trigger via comment) applies to every adopting repo at once, instead of
# being copy-pasted into each repo's caller file (that copy-paste already drifted once:
# repos ended up with different re-trigger keywords before this was centralized).
#
# github.event_name / github.event.* below read the ORIGINAL triggering event of the
# calling workflow (pull_request_target or issue_comment), not "workflow_call" — this is
# documented GitHub Actions behavior for workflow_call, not an assumption made here.
#
# The caller owns only: its own "on:" triggers (pull_request_target + issue_comment,
# required because GitHub has no way to invoke a workflow_call workflow without a
# concrete event trigger living in the calling repo), the "permissions:" grant (the
# GITHUB_TOKEN used by steps below cannot be granted more than the caller declares), and
# the secrets/inputs mapping. This workflow owns the trigger gating, the concurrency
# group, and the review itself. Align with upstream:
# https://github.com/alibaba/open-code-review/blob/main/examples/github_actions/ocr-review.yml
#
# Re-trigger keyword ("/gpustack-code-review" / "@gpustack-code-review") is intentionally
# hardcoded below rather than exposed as an input: it is the org-wide standard for this
# bot, not a per-repo choice — making it configurable is exactly the kind of duplication
# this workflow exists to remove.
#
# Required GitHub App permissions (configured on the App, not here): Pull requests:
# Read and write, Contents: Read and write (write side needed only by
# resolve_outdated: GitHub gates the review-thread resolve mutation on
# repository write access), Metadata: Read-only. The installation is resolved
# from the calling repository, so the App must be installed on each adopting repo.
# (create-github-app-token has no installation-id input; it resolves the installation
# from the caller repository, so no installation id is ever passed.)
#
# This workflow is deliberately model-agnostic: which LLM endpoint, model, and
# credentials a review runs with is the caller's business — it passes them via the
# llm-* inputs and the secrets mapping. Nothing here names a provider.
#
# MCP servers for the review are seeded here as well (Configure MCP Servers step):
# DeepWiki always (remote, auth-free), Serena by default (opt out via
# enable-serena-mcp: "false"), and the official github-mcp-server by default
# (read-only build, pull_requests toolset only; opt out via enable-github-mcp:
# "false"). The github server exists so the reviewer can read this PR's prior
# review threads — including maintainer replies that declined or answered a
# finding — before raising one: a rebase rewrites history, which invalidates
# the checkpoint range and forces a full re-review, and without prior-thread
# context the reviewer used to re-raise already-rejected findings round after
# round (observed on gpustack-operator#488). The MCP config is written by this
# workflow only and never read from PR-controlled files, keeping the
# pull_request_target safety posture intact.
#
# llm-auth-token may arrive as a comma-separated list of equivalent tokens. The
# provider's quota is per token, and an exhausted weekly quota surfaces as HTTP
# 429 mid-review, which burns every LLM retry and fails the run (provider error
# code 1310, gpustack run 35594845656). The Select LLM Token step probes each
# listed token with a 1-output-token streaming /chat/completions request and
# hands the first token answering below HTTP 400 to the action — the last token
# if every one answers an error, so an all-failing list fails exactly like a
# single token would.

name: Code Review

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      llm-url:
        description: 'LLM API endpoint. A base URL is fine: OCR appends /chat/completions.'
        required: true
        type: string
      llm-model:
        description: 'LLM model name.'
        required: true
        type: string
      llm-use-anthropic:
        description: '"true" selects the Anthropic protocol; anything else selects OpenAI-compatible.'
        required: false
        type: string
        default: "false"
      llm-thinking:
        description: 'Thinking mode: "enabled" or "disabled". Mapped to the llm.extra_body request field ({"thinking": {"type": ...}}, a GLM/Qwen-class provider field).'
        required: false
        type: string
        default: "disabled"
      llm-thinking-clear:
        description: '"true" lets the provider clear prior-turn reasoning from the context (GLM-class default); "false" keeps it. Mapped to thinking.clear_thinking in llm.extra_body.'
        required: false
        type: string
        default: "false"
      llm-temperature:
        description: 'Sampling temperature sent as the temperature request field; pins the profile so reviews stay reproducible across provider default changes.'
        required: false
        type: string
        default: "0.4"
      llm-top-p:
        description: 'Nucleus-sampling threshold sent as the top_p request field.'
        required: false
        type: string
        default: "0.9"
      llm-reasoning-effort:
        description: 'Reasoning depth for thinking-enabled models (e.g. GLM-5.3, where thinking is always on): "minimal", "low", "medium", "high", or "max" (union of the OpenAI and GLM vocabularies). Forwarded to the action''s llm_reasoning_effort input, which merges it into llm.extra_body as reasoning_effort — an explicit reasoning_effort key in the extra_body wins. Empty = send nothing (provider default).'
        required: false
        type: string
        default: ""
      stream-progress:
        description: '"true" streams live [ocr] review progress into the workflow log (human audience on stderr); "false" stays silent until the run finishes. Forwarded to the action''s stream_progress input.'
        required: false
        type: string
        default: "true"
      language:
        description: 'Review output language (e.g. English, Chinese).'
        required: false
        type: string
        default: "English"
      ocr-version:
        description: 'npm version spec for @alibaba-group/open-code-review (v1.9.6 or newer).'
        required: false
        type: string
        default: "latest"
      review-concurrency:
        description: 'Value passed to `ocr review --concurrency`; empty keeps the OCR default.'
        required: false
        type: string
        default: ""
      effort:
        description: 'Review effort preset: "low", "medium", or "high" (1/2/3 review rounds per file). Passed to the action''s native effort input, which forwards it as `ocr review --effort`. Empty falls back to "medium", which is also the OCR default.'
        required: false
        type: string
        default: "medium"
      route-severity-below:
        description: 'Severity threshold whose at-or-below findings are routed from inline comments to the PR summary (never dropped): "critical", "high", "medium", or "low". "low" keeps only medium-and-above findings inline. Empty disables severity routing.'
        required: false
        type: string
        default: "low"
      route-categories:
        description: 'Comma-separated categories routed from inline comments to the PR summary (never dropped), case-insensitive: bug, security, performance, maintainability, test, style, documentation, other. Unknown tokens are ignored. Combines with route-severity-below on either condition. Empty disables category routing.'
        required: false
        type: string
        default: ""
      # Total token budget (input+output) for the whole review, forwarded to the
      # action's max_tokens_budget input; dispatch stops once exceeded, partial
      # results still publish, exit 0. Empty = unlimited.
      max-tokens-budget:
        description: 'Total token budget (input+output) for the whole review; dispatch stops once exceeded, partial results still publish, exit 0. Empty = unlimited.'
        required: false
        type: string
        default: "10000000"
      # Timeout layering, outermost first: the job-level timeout-minutes is the
      # hard ceiling; review-task-timeout bounds each file's review inside it;
      # llm-timeout bounds a single LLM request inside a file's review. The
      # llm-timeout default is 60m per request: slow non-flash models on large
      # files can run a single request for many minutes, and the upstream 300s
      # default fails such requests outright.
      llm-timeout:
        description: 'Single LLM request timeout in seconds. Passed to the action as llm_timeout (env OCR_LLM_TIMEOUT).'
        required: false
        type: string
        default: "3600"
      review-task-timeout:
        description: 'Per-file review task timeout in minutes (1-120). Passed to the action as review_task_timeout (`ocr review --timeout`).'
        required: false
        type: string
        default: "15"
      enable-serena-mcp:
        description: '"false" skips the Serena MCP server (symbol navigation over the checked-out PR code). Language servers are auto-detected and set up by this workflow.'
        required: false
        type: string
        default: "true"
      enable-github-mcp:
        description: '"false" skips the read-only github-mcp-server (prior PR review threads for the reviewer; see the static background passed to the action).'
        required: false
        type: string
        default: "true"
      resolve-outdated:
        description: 'Forwarded to the action''s resolve_outdated input: "false" does nothing, "report" logs which outdated bot threads would be resolved, "true" resolves them (threads with human replies are never touched). "true" requires repository write access on the token the action posts with: here that is the GitHub App installation token, which carries Contents: write from the App registration (a plain GITHUB_TOKEN setup would instead need contents: write in the caller''s permissions block).'
        required: false
        type: string
        default: "true"
    secrets:
      llm-auth-token:
        description: 'LLM API auth token, or a comma-separated list of equivalent tokens: a list is probed before the review with a minimal streaming /chat/completions request per token, the first answer below HTTP 400 wins, and the last token is used if all answer errors (same failure mode as a single token).'
        required: true
      app-id:
        description: 'GitHub App ID used to author review comments.'
        required: true
      app-private-key:
        description: 'GitHub App private key (the full PEM, including BEGIN/END lines).'
        required: true

jobs:
  review:
    # Run on PR events, or on human-authored comments starting with the trigger
    # keyword. Bot comments are excluded as a safety net: GITHUB_TOKEN already
    # suppresses events from bot-posted comments, but a PAT/App token would not.
    # issue_comment triggers are further gated on author_association so only
    # MEMBER/OWNER/COLLABORATOR users can spend LLM quota via re-review.
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && (
          github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
        && (
          startsWith(github.event.comment.body, '/gpustack-code-review')
          || startsWith(github.event.comment.body, '@gpustack-code-review')
        )
      )
    # Conditional concurrency group.
    #
    # GitHub Actions evaluates concurrency BEFORE job-level if-conditions. With a
    # flat group (ocr-<pr_number>), every comment on the PR — even an unrelated
    # conversation reply that will be skipped — enters the same group and, because
    # cancel-in-progress is true, cancels any in-progress review. The result: a
    # single normal comment kills a running review, and you see "two runs, one
    # cancelled" in the Actions tab.
    #
    # Fix: matching events (PR events + /gpustack-code-review comments) share a per-PR
    # group so a new review cancels any stale one for the same PR. Non-matching
    # comments land in a unique noop-<run_id> group that can never collide with a
    # real review, so they are skipped instantly without disrupting anything.
    #
    # The group key deliberately avoids github.workflow (it would collide with the
    # caller's own concurrency group, if any, and cancel the caller instead of just
    # this job) — see GitHub's reusable-workflow concurrency caveat.
    concurrency:
      group: >-
        ${{
          (
            github.event_name == 'pull_request_target'
            || (
              github.event_name == 'issue_comment'
              && github.event.issue.pull_request
              && github.event.comment.user.type != 'Bot'
              && (
                github.event.comment.author_association == 'MEMBER'
                || github.event.comment.author_association == 'OWNER'
                || github.event.comment.author_association == 'COLLABORATOR'
              )
              && (
                startsWith(github.event.comment.body, '/gpustack-code-review')
                || startsWith(github.event.comment.body, '@gpustack-code-review')
              )
            )
          )
          && format('ocr-{0}', github.event.pull_request.number || github.event.issue.number)
          || format('noop-{0}', github.run_id)
        }}
      cancel-in-progress: true
    # Reviews on large diffs regularly run past 30 minutes
    # (observed on gpustack-operator); give them room to finish.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Get PR Context
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            // For issue_comment events, resolve PR base/head so the action
            // can review the right diff (issue_comment has no top-level
            // pull_request payload fields).
            const prNumber = context.issue.number;
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);
      - name: Get GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
      - name: Resolve Thinking Mode
        id: thinking
        env:
          INPUT_LLM_THINKING: ${{ inputs.llm-thinking }}
          INPUT_LLM_THINKING_CLEAR: ${{ inputs.llm-thinking-clear }}
          INPUT_LLM_TEMPERATURE: ${{ inputs.llm-temperature }}
          INPUT_LLM_TOP_P: ${{ inputs.llm-top-p }}
        run: |
          # The llm-thinking input decides the extra_body sent to the LLM; only an
          # explicit "enabled" turns thinking on — an empty or misspelled value
          # (e.g. an unset org variable) safely falls back to disabled. Building
          # the JSON in a step (not inline in the expression) keeps the colons
          # out of YAML flow-scalar parsing. clear_thinking, temperature and
          # top_p ride the same body (see the inputs); temperature/top_p default
          # to 0.4/0.9 so reviews stay reproducible across provider default
          # changes. temperature/top_p pass through unquoted — the caller owns
          # supplying valid JSON numbers.
          TYPE="disabled"
          if [[ "${INPUT_LLM_THINKING}" == "enabled" ]]; then
            TYPE="enabled"
          fi
          CLEAR="false"
          if [[ "${INPUT_LLM_THINKING_CLEAR}" == "true" ]]; then
            CLEAR="true"
          fi
          printf 'extra_body={"thinking": {"type": "%s", "clear_thinking": %s}, "temperature": %s, "top_p": %s}\n' \
            "${TYPE}" "${CLEAR}" "${INPUT_LLM_TEMPERATURE}" "${INPUT_LLM_TOP_P}" >> "$GITHUB_OUTPUT"
          echo "DEBUG: llm-thinking=${TYPE} clear_thinking=${CLEAR} temperature=${INPUT_LLM_TEMPERATURE} top_p=${INPUT_LLM_TOP_P}"
      - name: Detect Serena Languages
        id: serena-langs
        if: inputs.enable-serena-mcp == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Serena self-provisions nearly every language server on first use
          # (npm/uvx/GitHub-release downloads — node and uv are already ensured
          # by the runner image and the setup-uv step). The one exception we
          # install ourselves is Go's gopls, so detection only asks one
          # question: is this a Go repository? It probes through the GitHub API
          # because the caller's code is not on disk yet — the OCR action
          # checks it out internally (a plain `find` would see an empty
          # workspace). Caller-transparent: if another language ever needs a
          # preinstalled LSP, add its marker here and its install step below.
          LANGS=""
          gh api "repos/${GITHUB_REPOSITORY}/contents/go.mod" --silent 2>/dev/null && LANGS="go"
          echo "languages=${LANGS}" >> "$GITHUB_OUTPUT"
          echo "DEBUG: serena-languages=${LANGS:-<none detected>}"
      - name: Set up uv
        if: inputs.enable-serena-mcp == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Serena MCP
        if: inputs.enable-serena-mcp == 'true'
        run: |
          # A wheel install (not uvx-from-source) keeps startup off the critical path.
          uv tool install -p 3.13 serena-agent
          echo "DEBUG: serena $(serena --version)"
      - name: Set up Go
        if: inputs.enable-serena-mcp == 'true' && contains(steps.serena-langs.outputs.languages, 'go')
        uses: actions/setup-go@v7
        with:
          # gopls only needs a current toolchain to build; the reviewed module's
          # own go directive (go.mod) is irrelevant here, and it is not on disk
          # yet anyway (the OCR action checks the code out internally).
          go-version: stable
          # No go.sum is on disk at this point, so the module cache has nothing
          # to key on; gopls's module download is simply paid per run.
          cache: false
      - name: Install gopls
        if: inputs.enable-serena-mcp == 'true' && contains(steps.serena-langs.outputs.languages, 'go')
        run: |
          # gopls is not auto-downloaded by Serena; pin it for reproducibility.
          go install golang.org/x/tools/gopls@v0.23.0
          echo "DEBUG: $(gopls version)"
      - name: Install Github MCP
        if: inputs.enable-github-mcp == 'true'
        run: |
          # Official GitHub MCP server, pinned release + sha256 (same posture
          # as the gopls pin above). Read-only mode with the pull_requests
          # toolset exposes exactly three tools (list_pull_requests,
          # pull_request_read, search_pull_requests); the reviewer uses
          # pull_request_read to fetch prior review threads.
          VERSION="1.12.2"
          SHA256="95843162759da2c31dde082dd145be35db82164594796c294414b69790c2290e"
          mkdir -p "${HOME}/.local/bin"
          curl -fsSL "https://github.com/github/github-mcp-server/releases/download/v${VERSION}/github-mcp-server_Linux_x86_64.tar.gz" -o /tmp/github-mcp-server.tar.gz
          echo "${SHA256}  /tmp/github-mcp-server.tar.gz" | sha256sum -c -
          tar -xzf /tmp/github-mcp-server.tar.gz -C "${HOME}/.local/bin" github-mcp-server
          echo "DEBUG: $("${HOME}/.local/bin/github-mcp-server" --version | head -1)"
      - name: Configure MCP Servers
        env:
          INPUT_ENABLE_SERENA: ${{ inputs.enable-serena-mcp }}
          INPUT_ENABLE_GITHUB_MCP: ${{ inputs.enable-github-mcp }}
          GITHUB_MCP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # OpenCodeReview reads MCP servers only from ~/.opencodereview/config.json
          # at review startup; the composite action has no MCP input. OCR's
          # `config set` merges by key (load-modify-save), so the mcp_servers seeded
          # here survive the action's own llm.* writes (verified against OCR's
          # config_cmd.go and exercised locally against the published CLI).
          # DeepWiki is registered unconditionally: it is a remote server requiring
          # no auth and no local install, so every review can ground claims about
          # third-party dependencies against upstream docs for free.
          CONFIG_DIR="${HOME}/.opencodereview"
          CONFIG_FILE="${CONFIG_DIR}/config.json"
          mkdir -p "${CONFIG_DIR}"
          [[ -f "${CONFIG_FILE}" ]] || echo '{}' > "${CONFIG_FILE}"
          jq '.mcp_servers.deepwiki = {"type": "remote", "url": "https://mcp.deepwiki.com/mcp"}' \
            "${CONFIG_FILE}" > "${CONFIG_FILE}.tmp"
          mv "${CONFIG_FILE}.tmp" "${CONFIG_FILE}"
          if [[ "${INPUT_ENABLE_SERENA}" == "true" ]]; then
            # Serena runs as a stdio subprocess with CI-safe flags: ide context,
            # one-shot / no-onboarding / no-memories modes, no web dashboard.
            # --project points at the workspace, which the OCR action's internal
            # checkout populates before OCR spawns MCP clients. The absolute
            # binary path keeps the entry independent of PATH resolution.
            jq --arg cmd "${HOME}/.local/bin/serena" --arg proj "${GITHUB_WORKSPACE}" \
              '.mcp_servers.serena = {command: $cmd, args: ["start-mcp-server", "--context", "ide", "--mode", "one-shot", "--mode", "no-onboarding", "--mode", "no-memories", "--enable-web-dashboard", "false", "--project", $proj]}' \
              "${CONFIG_FILE}" > "${CONFIG_FILE}.tmp"
            mv "${CONFIG_FILE}.tmp" "${CONFIG_FILE}"
          fi
          if [[ "${INPUT_ENABLE_GITHUB_MCP}" == "true" ]]; then
            # The github server authenticates with the same App installation
            # token the action posts comments with — no new credential leaves
            # the runner. env must be a KEY=VALUE string array: OCR models it
            # as []string (MCPServerConfig in config_cmd.go), and an object
            # here fails config load with "cannot unmarshal object ... of type
            # []string" and kills the review before it starts. The env entry
            # is stripped from the DEBUG echo below so the token cannot leak
            # even if log masking regresses upstream.
            jq --arg cmd "${HOME}/.local/bin/github-mcp-server" --arg tok "${GITHUB_MCP_TOKEN}" \
              '.mcp_servers.github = {command: $cmd, args: ["stdio", "--read-only", "--toolsets", "pull_requests"], env: ["GITHUB_PERSONAL_ACCESS_TOKEN=" + $tok]}' \
              "${CONFIG_FILE}" > "${CONFIG_FILE}.tmp"
            mv "${CONFIG_FILE}.tmp" "${CONFIG_FILE}"
          fi
          echo "DEBUG: seeded mcp_servers=$(jq -c '.mcp_servers | map_values(del(.env))' "${CONFIG_FILE}")"
      - name: Select LLM Token
        id: llm-token
        env:
          LLM_AUTH_TOKENS: ${{ secrets.llm-auth-token }}
          LLM_URL: ${{ inputs.llm-url }}
          LLM_MODEL: ${{ inputs.llm-model }}
        run: |
          # llm-auth-token may be a comma-separated list of equivalent tokens
          # (see the header comment for the 429 evidence). Probe each token
          # with a minimal streaming chat request — max_tokens 1, so a healthy
          # token costs one output token — and select the first that answers
          # below HTTP 400; if every token answers an error, fall back to the
          # last one so the failure mode is unchanged from a single-token
          # setup. A probe that never got an HTTP response (curl 000, e.g. a
          # transport failure) selects its token: the endpoint is shared by
          # all tokens, so skipping would buy nothing. A non-OpenAI endpoint
          # (llm-use-anthropic) 404s every probe and lands on the last token —
          # still identical to not probing.
          IFS=',' read -ra RAW_TOKENS <<< "${LLM_AUTH_TOKENS}"
          TOKENS=()
          for raw in "${RAW_TOKENS[@]}"; do
            tok="$(printf '%s' "${raw}" | tr -d '[:space:]')"
            if [[ -n "${tok}" ]]; then
              echo "::add-mask::${tok}"
              TOKENS+=("${tok}")
            fi
          done
          COUNT="${#TOKENS[@]}"
          if [[ "${COUNT}" -eq 0 ]]; then
            echo "::error::llm-auth-token contained no usable token"
            exit 1
          fi
          SELECTED=""
          if [[ "${COUNT}" -eq 1 ]]; then
            SELECTED="${TOKENS[0]}"
            echo "DEBUG: single llm-auth-token configured; no probe needed"
          else
            ENDPOINT="${LLM_URL%/}/chat/completions"
            BODY="$(jq -nc --arg model "${LLM_MODEL}" \
              '{model: $model, stream: true, max_tokens: 1, messages: [{role: "user", content: "ping"}]}')"
            for i in "${!TOKENS[@]}"; do
              code="$(curl -sS -N -o /dev/null -w '%{http_code}' --max-time 90 \
                -X POST "${ENDPOINT}" \
                -H "Authorization: Bearer ${TOKENS[$i]}" \
                -H 'Content-Type: application/json' \
                -d "${BODY}" || true)"
              if [[ "${code}" =~ ^[0-9]+$ ]] && (( 10#${code} >= 400 )); then
                echo "DEBUG: token $((i + 1))/${COUNT} answered HTTP ${code} (>= 400); trying next"
              else
                SELECTED="${TOKENS[$i]}"
                echo "DEBUG: token $((i + 1))/${COUNT} answered HTTP ${code}; selected"
                break
              fi
            done
            if [[ -z "${SELECTED}" ]]; then
              SELECTED="${TOKENS[$((COUNT - 1))]}"
              echo "DEBUG: all ${COUNT} tokens answered HTTP >= 400; falling back to the last token"
            fi
          fi
          echo "token=${SELECTED}" >> "${GITHUB_OUTPUT}"
      - name: Run OpenCodeReview
        # Pinned to the upstream release carrying the review-control inputs
        # used below (effort, max_tokens_budget, stream_progress,
        # llm_reasoning_effort, route_severity_below, route_categories,
        # resolve_outdated) plus the within-batch incremental dedup that
        # landed after v1.11.9.
        uses: alibaba/open-code-review@v1.12.7
        with:
          llm_url: ${{ inputs.llm-url }}
          # The probe-selected token (see Select LLM Token above), not the raw
          # comma-separated secret. Individual tokens are ::add-mask::ed there
          # so the output value stays masked here.
          llm_auth_token: ${{ steps.llm-token.outputs.token }}
          llm_model: ${{ inputs.llm-model }}
          llm_use_anthropic: ${{ inputs.llm-use-anthropic }}
          llm_extra_body: ${{ steps.thinking.outputs.extra_body }}
          language: ${{ inputs.language }}
          ocr_version: ${{ inputs.ocr-version }}
          review_concurrency: ${{ inputs.review-concurrency }}
          effort: ${{ inputs.effort }}
          llm_timeout: ${{ inputs.llm-timeout }}
          review_task_timeout: ${{ inputs.review-task-timeout }}
          # Static reviewer-context briefing. It must stay a constant string:
          # the action folds background into the checkpoint fingerprint, so
          # any per-run digest here would invalidate checkpoint_range on every
          # run and force full reviews forever. (First deploy does trigger one
          # config_changed full review per PR — expected, once.) The dynamic
          # part lives behind the read-only github MCP server seeded above,
          # which the fingerprint does not cover.
          background: >-
            This pull request may already have review rounds from this bot
            (inline comments authored by a GitHub App bot account). If a
            github MCP server is available in this run, use its
            pull_request_read tool (methods get_review_comments / get_reviews)
            to list this PR's existing review comments and their replies
            before raising a finding. Do not re-raise a finding — same root
            cause, even at a shifted line or in a sibling file — that a
            maintainer declined, disputed, or already answered, unless the
            underlying code changed materially since. Raising a genuinely new
            problem is always welcome; repeating a rejected one is the worst
            outcome of a re-review. If no github MCP server is available,
            proceed without this check.
          # Cap total token spend per review (input+output); on overflow
          # dispatch stops, partial results are published, and the run exits 0.
          max_tokens_budget: ${{ inputs.max-tokens-budget }}
          # Reasoning depth for thinking-enabled models; merged into the request
          # body as reasoning_effort. Empty = provider default.
          llm_reasoning_effort: ${{ inputs.llm-reasoning-effort }}
          # Stream live [ocr] progress into the workflow log (on by default
          # here; the upstream action default is off).
          stream_progress: ${{ inputs.stream-progress }}
          # Keep inline comments to medium-and-above findings; low-severity
          # findings land in the PR summary instead of inline threads.
          route_severity_below: ${{ inputs.route-severity-below }}
          # Category routing is off by default; list categories to route them
          # to the summary (combines with the severity threshold on either).
          route_categories: ${{ inputs.route-categories }}
          # "true": actually resolve the bot's outdated inline threads
          # (threads with human replies are never touched). The resolve
          # mutation requires repository write access; the App registration
          # carries Contents: write. "report" downgrades this to log-only.
          resolve_outdated: ${{ inputs.resolve-outdated }}
          # Dedup against already-posted bot comments and re-review only the
          # range since the last recorded checkpoint (sticky summary defaults
          # to true, satisfying checkpoint_range's prerequisite).
          incremental: 'true'
          checkpoint_range: 'true'
          github_token: ${{ steps.app-token.outputs.token }}
          # For issue_comment triggers, pass the resolved refs; for
          # pull_request_target the action resolves them from the event.
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
      - name: Show OCR Session Log
        # always(): the transcript matters most when the review itself failed
        # or was cancelled, so replay it even then. Diagnostics only — this
        # step must never fail the job.
        if: always()
        run: |
          # The composite action runs `ocr review --audience agent`, which
          # discards every progress line, so the step log above stays silent
          # until the final result JSON. OCR still persists a full per-event
          # transcript on every run to
          # ~/.opencodereview/sessions/<repo>/<session-id>.jsonl (LLM
          # requests/responses with token usage, tool calls, per-file
          # outcomes). Replay the newest session here so the Actions log
          # shows what the review actually did.
          if ! command -v ocr >/dev/null 2>&1; then
            echo "ocr CLI not on PATH (install step never ran?); skipping session replay"
            exit 0
          fi
          SUMMARY="$(ocr session list --json --limit 1 2>/dev/null || true)"
          SID="$(printf '%s' "${SUMMARY}" | jq -r '.[0].session_id // empty')"
          FILE="$(printf '%s' "${SUMMARY}" | jq -r '.[0].file_path // empty')"
          if [[ -z "${SID}" || ! -f "${FILE}" ]]; then
            echo "no persisted OCR session found; nothing to replay"
            exit 0
          fi
          echo "=== OCR session ${SID} ==="
          ocr session show "${SID}" || true
          echo "=== OCR session events (from ${FILE}) ==="
          # One line per event; llm_request message bodies are deliberately
          # omitted (they are the full prompts — see the uploaded artifact).
          jq -r '"\(.timestamp[11:19]) [\(.type)] \(.filePath // "-")" +
            (if .type == "llm_response" then
              " model=\(.model) in=\(.usage.prompt_tokens) out=\(.usage.completion_tokens) cache_read=\(.usage.cache_read_tokens) \(.duration_ms)ms"
            elif .type == "tool_call" then
              " \(.tool_name) ok=\(.ok) \(.duration_ms)ms"
            elif .type == "llm_error" then
              " req=\(.request_no) \(.duration_ms)ms error=\(.error)"
            elif .type == "llm_request" then
              " task=\(.taskType) req=\(.request_no)"
            else "" end)' "${FILE}" || true
      - name: Resolve OCR Session Transcript Path
        if: always()
        # $HOME is a runner env var, not part of the `env` expression context —
        # resolve the path in shell first (`${{ env.HOME }}` would expand empty).
        run: echo "OCR_SESSIONS_DIR=${HOME}/.opencodereview/sessions" >> "$GITHUB_ENV"
      - name: Upload OCR Session Transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-session-${{ github.run_id }}
          path: ${{ env.OCR_SESSIONS_DIR }}
          if-no-files-found: ignore
          retention-days: 1
